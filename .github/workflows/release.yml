name: Release

# Opens or refreshes the release pull request while change files are pending,
# and publishes the workspace to crates.io once that pull request is merged.
#
# The versions and the changelog come from Knope (https://knope.tech): every
# published crate shares one version, bumped by the change files in
# `.changeset/`. Publishing runs `cargo publish --workspace`, which orders the
# crates by dependency. Cargo refuses to publish a version that already exists,
# so the crates already on crates.io are excluded first: a failed publish is
# resumed by re-running the job.
#
# The workflow runs on `main` and on the `N.x` maintenance branches, each with
# its own release branch and pull request. During a major transition, `main`
# is in pre-release mode (see `knope.toml` and the `cut` workflow): its change
# files survive each release candidate and are consumed by the stable release.

on:
  push:
    branches: [main, '[0-9]+.x']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Prepare the release without pushing, and package the crates without uploading them'
        type: boolean
        default: true
      override-version:
        description: 'Version to release instead of the one the change files amount to, e.g. 1.0.0'
        type: string
        default: ''

permissions:
  contents: read

env:
  KNOPE_VERSION: '0.23.2'
  RUST_TOOLCHAIN: '1.92.0'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Knope
        uses: knope-dev/action@v2.1.2
        with:
          version: ${{ env.KNOPE_VERSION }}

      - name: Decide what to do
        id: plan
        # The version in the manifests is the current release once the release pull request is
        # merged, so a missing `v<version>` tag means it still has to be published. Otherwise, a
        # release is prepared when the change files differ from those of the current release
        # (in pre-release mode they persist, so only new ones count), or when `main` has left
        # pre-release mode but still carries a release candidate: the stable release is due.
        run: |
          case "$GITHUB_REF_NAME" in
            main) ;;
            *) echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]+\.x$' || {
                 echo "::error::Releases run from main or from a maintenance branch, not from $GITHUB_REF_NAME."
                 exit 1
               } ;;
          esac
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "codama") | .version')"
          if ! git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            action=publish
          elif ! git diff --quiet "v$version" -- .changeset; then
            action=prepare
          elif [[ "$version" == *-* ]] && ! grep -q '^prerelease_label = ' knope.toml; then
            action=prepare
          else
            action=none
          fi
          if [ -n "$OVERRIDE_VERSION" ] && [ "$action" != prepare ]; then
            echo "::error::override-version=$OVERRIDE_VERSION was given but there is no release to prepare (plan: $action)."
            exit 1
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version on $GITHUB_REF_NAME: $action"
        env:
          OVERRIDE_VERSION: ${{ inputs.override-version }}

      - name: Set the git identity of the release app
        if: steps.plan.outputs.action != 'none'
        uses: ./.github/actions/release-app-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # --- Change files pending: open or refresh the release pull request. ---------------------

      - name: Prepare the release pull request
        if: steps.plan.outputs.action == 'prepare'
        # The release branch is rebuilt from the current commit on every run, so the pull request
        # always reflects every pending change file. The version override is for the releases
        # Knope cannot compute, such as the first stable major from a 0.x version.
        run: |
          git checkout -B "knope-release/$GITHUB_REF_NAME"
          knope prepare-release --verbose ${OVERRIDE_VERSION:+--override-version "$OVERRIDE_VERSION"} ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OVERRIDE_VERSION: ${{ inputs.override-version }}

      # --- Release pull request merged: publish, then tag and create the GitHub release. --------

      - name: Install the Rust toolchain
        if: steps.plan.outputs.action == 'publish'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache dependencies
        if: steps.plan.outputs.action == 'publish'
        uses: Swatinem/rust-cache@v2

      - name: Publish the workspace to crates.io
        if: steps.plan.outputs.action == 'publish'
        # Cargo errors on a version that already exists, so the crates a previous run already
        # published are excluded and resolved from the registry instead.
        run: |
          version='${{ steps.plan.outputs.version }}'
          crates=()
          exclude=()
          for crate in $(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.publish == null) | .name'); do
            if curl --fail --silent --user-agent 'codama-rs release workflow' --output /dev/null "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is already on crates.io"
              exclude+=(--exclude "$crate")
            else
              crates+=("$crate")
            fi
          done
          if [ "${#crates[@]}" = "0" ]; then
            echo "Every crate is already on crates.io, nothing to publish."
            exit 0
          fi
          echo "Publishing: ${crates[*]}"
          cargo +${{ env.RUST_TOOLCHAIN }} publish --workspace --locked "${exclude[@]}" ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Tag and create the GitHub release
        if: steps.plan.outputs.action == 'publish' && !inputs.dry-run
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
