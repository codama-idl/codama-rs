name: Release

# Opens or refreshes the release pull request while change files are pending,
# and publishes the workspace to crates.io once that pull request is merged.
#
# The versions and the changelog come from Knope (https://knope.tech): every
# published crate shares one version, bumped by the change files in
# `.changeset/`. Publishing runs `cargo publish --workspace`, which orders the
# crates by dependency. Cargo refuses to publish a version that already exists,
# so the crates already on crates.io are excluded first: a failed publish is
# resumed by re-running the job.

on:
  push:
    # The release branch and the base of the release pull request are those of `main`: the
    # maintenance branches get their own when they are cut.
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Prepare the release without pushing, and package the crates without uploading them'
        type: boolean
        default: true

permissions:
  contents: read

env:
  KNOPE_VERSION: '0.23.2'
  RUST_TOOLCHAIN: '1.92.0'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Knope
        uses: knope-dev/action@v2.1.2
        with:
          version: ${{ env.KNOPE_VERSION }}

      - name: Decide what to do
        id: plan
        # The version in the manifests is the current release once the release pull request is
        # merged, so a missing `v<version>` tag means it still has to be published.
        run: |
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "codama") | .version')"
          pending="$(find .changeset -name '*.md' 2> /dev/null | wc -l | tr -d ' ')"
          if [ "$pending" != "0" ]; then
            action=prepare
          elif ! git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            action=publish
          else
            action=none
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version, $pending pending change file(s): $action"

      - name: Set the git identity of the release app
        if: steps.plan.outputs.action != 'none'
        run: |
          slug="${{ steps.app-token.outputs.app-slug }}[bot]"
          id="$(gh api "/users/$slug" --jq .id)"
          git config user.name "$slug"
          git config user.email "$id+$slug@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # --- Change files pending: open or refresh the release pull request. ---------------------

      - name: Prepare the release pull request
        if: steps.plan.outputs.action == 'prepare'
        # The release branch is rebuilt from the current commit on every run, so the pull request
        # always reflects every pending change file.
        # An empty prerelease label would produce versions such as `0.13.3-.0`, so the flag is
        # only passed when the repository variable is set, i.e. during a major transition.
        run: |
          git checkout -B knope/release
          knope prepare-release --verbose ${PRERELEASE_LABEL:+--prerelease-label "$PRERELEASE_LABEL"} ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PRERELEASE_LABEL: ${{ vars.KNOPE_PRERELEASE_LABEL }}

      # --- Release pull request merged: publish, then tag and create the GitHub release. --------

      - name: Install the Rust toolchain
        if: steps.plan.outputs.action == 'publish'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache dependencies
        if: steps.plan.outputs.action == 'publish'
        uses: Swatinem/rust-cache@v2

      - name: Publish the workspace to crates.io
        if: steps.plan.outputs.action == 'publish'
        # Cargo errors on a version that already exists, so the crates a previous run already
        # published are excluded and resolved from the registry instead.
        run: |
          version='${{ steps.plan.outputs.version }}'
          crates=()
          exclude=()
          for crate in $(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.publish == null) | .name'); do
            if curl --fail --silent --user-agent 'codama-rs release workflow' --output /dev/null "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is already on crates.io"
              exclude+=(--exclude "$crate")
            else
              crates+=("$crate")
            fi
          done
          if [ "${#crates[@]}" = "0" ]; then
            echo "Every crate is already on crates.io, nothing to publish."
            exit 0
          fi
          echo "Publishing: ${crates[*]}"
          cargo +${{ env.RUST_TOOLCHAIN }} publish --workspace --locked "${exclude[@]}" ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Tag and create the GitHub release
        if: steps.plan.outputs.action == 'publish' && !inputs.dry-run
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
