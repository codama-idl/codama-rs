[package]
name = "codama"
description = "Generate clients, CLIs, documentation and more from your Solana programs"
version = "1.0.0"
repository = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[dependencies]
codama-macros = { workspace = true }

[target.'cfg(not(target_os = "solana"))'.dependencies]
codama-errors = { workspace = true }
codama-plugin-core = { workspace = true }
codama-korok-visitors = { workspace = true }
codama-koroks = { workspace = true }
codama-nodes = { workspace = true }
codama-stores = { workspace = true }
codama-visitors-core = { workspace = true }
proc-macro2 = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
] }
