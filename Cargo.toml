[workspace]
resolver = "2"
members = [
  "codama",
  "codama-attributes",
  "codama-errors",
  "codama-koroks",
  "codama-plugin-core",
  "codama-korok-visitors",
  "codama-macros",
  "codama-nodes",
  "codama-nodes/derive",
  "codama-nodes/tests-derive",
  "codama-stores",
  "codama-syn-helpers",
  "codama-syn-helpers/tests-macros",
  "codama-validators",
  "codama-visitors-core",
  "codama-cli",
]

[workspace.dependencies]
codama = { version = "1.0.0", path = "codama" }
codama-attributes = { version = "1.0.0", path = "codama-attributes" }
codama-cli = { version = "1.0.0", path = "codama-cli" }
codama-errors = { version = "1.0.0", path = "codama-errors" }
codama-korok-visitors = { version = "1.0.0", path = "codama-korok-visitors" }
codama-koroks = { version = "1.0.0", path = "codama-koroks" }
codama-macros = { version = "1.0.0", path = "codama-macros" }
codama-nodes = { version = "1.0.0", path = "codama-nodes" }
codama-nodes-derive = { version = "1.0.0", path = "codama-nodes/derive" }
codama-plugin-core = { version = "1.0.0", path = "codama-plugin-core" }
codama-stores = { version = "1.0.0", path = "codama-stores" }
codama-syn-helpers = { version = "1.0.0", path = "codama-syn-helpers" }
codama-validators = { version = "1.0.0", path = "codama-validators" }
codama-visitors-core = { version = "1.0.0", path = "codama-visitors-core" }

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/codama-idl/codama-rs"
