[package]
name = "codama-korok-visitors"
description = "Visitors for Korok trees"
version = "1.0.0"
repository = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[dev-dependencies]
proc-macro2 = "1.0"
quote = "1.0"
codama-stores = { workspace = true }

[dependencies]
cargo_toml = "0.20"
codama-attributes = { workspace = true }
codama-errors = { workspace = true }
codama-koroks = { workspace = true }
codama-nodes = { workspace = true }
codama-syn-helpers = { workspace = true }
serde_json = "1.0"
syn = { version = "2.0", features = ["extra-traits", "full"] }

# TODO(spec v2): these tests use v1 instruction arguments. Enable them when the instruction visitor tests are ported.
[[test]]
name = "set_default_values_visitor"
test = false
