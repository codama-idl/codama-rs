[package]
name = "codama-koroks"
description = "Intermediate tree structure for collecting nodes"
version = "0.13.3"
repository = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[dev-dependencies]
quote = "1.0"

[dependencies]
codama-attributes = { workspace = true }
codama-errors = { workspace = true }
codama-nodes = { workspace = true }
codama-stores = { workspace = true }
codama-syn-helpers = { workspace = true }
derive_more = { version = "1.0", features = ["from"] }
proc-macro2 = "1.0"
syn = { version = "2.0", features = ["extra-traits", "full"] }
